server:
  port: 8080

spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      show-sql: true
      format_sql: true

  kafka:
    consumer:
      bootstrap-servers: localhost:10000,localhost:10001,localhost:10002
      group-id: member-group
    producer:
      bootstrap-servers: localhost:10000,localhost:10001,localhost:10002